<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sky SG">
<meta name="theme-color" content="#2F7FC1">
<title>Sky SG</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,600&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#2F7FC1; --ink:#FFFFFF; --soft:rgba(255,255,255,.74); --panel:rgba(255,255,255,.13); --line:rgba(255,255,255,.22);
  --sheet:#F4F6F8; --sheet-ink:#18212B; --sheet-soft:#5B6773; --sheet-line:#DCE1E6; --pick:#2F6FA8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sheet:#1B232C;--sheet-ink:#EEF2F5;--sheet-soft:#9AA6B2;--sheet-line:#2E3A46;--pick:#7DB8F0}}
:root[data-theme="dark"]{--sheet:#1B232C;--sheet-ink:#EEF2F5;--sheet-soft:#9AA6B2;--sheet-line:#2E3A46;--pick:#7DB8F0}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--sky)}
body{margin:0;min-height:100%;background:var(--sky);color:var(--ink);font:400 16px/1.45 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .8s,color .8s}
body[data-sky="clear"]{--sky:#2F7FC1}
body[data-sky="cloud"]{--sky:#657A8A}
body[data-sky="rain"]{--sky:#3B4E5E}
body[data-sky="storm"]{--sky:#2A2940}
body[data-sky="night"]{--sky:#16223A}
body[data-sky="haze"]{--sky:#B8B39E;--ink:#26261E;--soft:rgba(38,38,30,.72);--panel:rgba(38,38,30,.08);--line:rgba(38,38,30,.2)}
main{max-width:560px;margin:0 auto;padding:12px 16px 40px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid currentColor;outline-offset:2px}

/* top bar */
.top{display:flex;gap:10px;align-items:stretch}
.loc{flex:1;min-width:0;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 14px;color:var(--ink)}
.loc b{display:block;font-weight:600;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc small{color:var(--soft)}
.loc b::after{content:" ▾";font-weight:400;color:var(--soft)}
.icon{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 14px;color:var(--ink);font-size:.95rem}
.status{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 2px 0;font-size:.86rem;color:var(--soft)}
.upd{background:none;border:0;padding:6px 0;color:var(--ink);font-weight:600;display:flex;align-items:center;gap:6px}
.upd .spin{display:inline-block}
.upd[aria-busy="true"] .spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{padding:11px 14px;border-radius:12px;background:var(--panel);margin-top:10px;font-size:.9rem}

/* hero */
.hero{padding:22px 2px 6px}
.hero .when{font-size:.9rem;color:var(--soft);margin:0}
.hero .cond{font-family:"Bricolage Grotesque",Georgia,serif;font-weight:600;font-size:clamp(2.1rem,10vw,3rem);line-height:1.02;margin:6px 0 0}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.tile{background:var(--panel);border-radius:16px;padding:12px 14px;min-height:108px;display:flex;flex-direction:column}
.tile.wide{grid-column:1/-1}
.tile .lbl{font-size:.82rem;color:var(--soft)}
.tile .val{font-family:"Bricolage Grotesque",Georgia,serif;font-weight:300;font-size:2.3rem;line-height:1.05;margin:4px 0 2px;letter-spacing:-.02em}
.tile .val small{font-size:.45em;letter-spacing:0}
.tile .src{font-size:.74rem;color:var(--soft);margin-top:auto}
.band{display:inline-block;font-family:"Instrument Sans",sans-serif;font-size:.8rem;font-weight:600;padding:2px 9px;border-radius:999px;vertical-align:middle;margin-left:6px;color:#111}
.b-good{background:#8FE3A6}.b-mod{background:#9CCBFF}.b-unh{background:#FFD36B}.b-vunh{background:#FF9E6B}.b-haz{background:#FF7A7A}

/* lists */
.block{margin-top:22px}
.block h2{font-family:"Bricolage Grotesque",Georgia,serif;font-weight:600;font-size:1.12rem;margin:0 0 2px}
.block .sub{color:var(--soft);font-size:.85rem;margin:0 0 6px}
.list{list-style:none;margin:0;padding:0}
.list li{padding:11px 0;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.row .k{font-weight:600}
.row .v{text-align:right}
.mm{font-variant-numeric:tabular-nums;white-space:nowrap}
.mm span{color:var(--soft)}
.note{font-size:.86rem;color:var(--soft);margin-top:2px}
.tips{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.tips li{background:var(--panel);border-radius:12px;padding:9px 12px;font-size:.9rem;display:flex;gap:9px;align-items:flex-start}
.tips li span{flex:none}
.tip{margin-top:8px;font-size:.84rem;line-height:1.4;padding:8px 10px;border-radius:10px;background:var(--panel)}
.aq{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.aq .val{font-size:2rem}
.retry{margin-top:6px;align-self:flex-start;background:var(--ink);color:var(--sky);border:0;border-radius:10px;padding:6px 12px;font-weight:600;font-size:.85rem}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.links a{color:var(--ink);text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:.88rem}
.tip a{color:inherit;font-weight:600}
.hero .tip{margin-top:12px;font-size:.95rem}
.inst{display:flex;justify-content:space-between;align-items:center;gap:10px}
.inst-btns{display:flex;gap:6px;flex:none}
.inst button{border:0;border-radius:10px;padding:7px 12px;font-weight:600}
#instGo{background:var(--ink);color:var(--sky)}
#instX{background:transparent;color:var(--ink);padding:7px 8px}
.empty{margin-top:28px;padding:18px;border-radius:16px;background:var(--panel);text-align:center}
.empty button{margin-top:10px;background:var(--ink);color:var(--sky);border:0;border-radius:12px;padding:10px 16px;font-weight:600}
footer{margin-top:28px;font-size:.76rem;color:var(--soft)}
footer a{color:inherit}

/* bottom sheets */
dialog{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:86vh;border-radius:22px 22px 0 0;background:var(--sheet);color:var(--sheet-ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog[open]{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.sh{padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));overflow-y:auto;max-height:86vh}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sh-head h3{margin:0;font-family:"Bricolage Grotesque",Georgia,serif;font-weight:600;font-size:1.2rem}
.done{background:none;border:0;color:var(--pick);font-weight:600;padding:8px 0}
.hint{color:var(--sheet-soft);font-size:.86rem;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--sheet-line);background:transparent;border-radius:999px;padding:8px 14px}
.chip[aria-pressed="true"]{background:var(--pick);border-color:var(--pick);color:#fff}
.alist{list-style:none;margin:0;padding:0}
.alist button{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--sheet-line);padding:13px 2px;display:flex;justify-content:space-between}
.alist button[aria-current="true"]{color:var(--pick);font-weight:600}
.alist button[aria-current="true"]::after{content:"✓"}
.gps{width:100%;margin-top:12px;border:1px solid var(--sheet-line);background:transparent;border-radius:12px;padding:12px}
.tog{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-top:1px solid var(--sheet-line);gap:12px}
.tog span small{display:block;color:var(--sheet-soft);font-size:.8rem}
.sw{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:999px;background:var(--sheet-line);position:relative;flex:none;cursor:pointer;transition:background .15s;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw:checked{background:var(--pick)}
.sw:checked::after{transform:translateX(20px)}
.group{margin:16px 0 4px;font-weight:600;font-size:.9rem}
@media (prefers-reduced-motion:reduce){body,.sw,.sw::after{transition:none}dialog[open]{animation:none}.upd[aria-busy="true"] .spin{animation:none}}
</style>
</head>
<body data-sky="clear">
<main>
  <div class="top">
    <button class="loc" id="locOpen" aria-haspopup="dialog"><b id="locName">Loading…</b><small id="locRegion">Tap to choose your location</small></button>
    <button class="icon" id="setOpen" aria-haspopup="dialog">Customise</button>
  </div>
  <div class="status">
    <span id="ago">Getting the latest data…</span>
    <button class="upd" id="refresh" aria-busy="false"><span class="spin" aria-hidden="true">↻</span> Update now</button>
  </div>
  <div id="install" class="msg inst" hidden><span id="instText"></span><span class="inst-btns"><button type="button" id="instGo" hidden>Install</button><button type="button" id="instX" aria-label="Dismiss">✕</button></span></div>
  <div id="msg" class="msg" role="status" hidden></div>
  <div id="content" aria-live="polite"></div>
  <footer>
    Data: NEA and MSS via <a href="https://data.gov.sg" target="_blank" rel="noopener">data.gov.sg</a>. Tips are general guidance, not medical advice.
  </footer>
</main>

<dialog id="locSheet" aria-labelledby="locTitle">
  <div class="sh">
    <div class="sh-head"><h3 id="locTitle">Choose location</h3><button class="done" data-close>Done</button></div>
    <p class="hint">Pick your region, then your area.</p>
    <div class="chips" id="regionChips" role="group" aria-label="Region"></div>
    <ul class="alist" id="areaList"></ul>
    <button class="gps" id="gps">📍 Use my current location</button>
  </div>
</dialog>

<dialog id="setSheet" aria-labelledby="setTitle">
  <div class="sh">
    <div class="sh-head"><h3 id="setTitle">Customise</h3><button class="done" data-close>Done</button></div>
    <p class="hint">Hidden items update faster.</p>
    <div id="toggles"></div>
    <div class="group">Tips</div>
    <label class="tog"><span>Show tips<small>Umbrella, sunscreen, air quality</small></span><input type="checkbox" class="sw" id="tipsSw"></label>
    <div class="group">Updates</div>
    <label class="tog"><span>Auto-update<small>Every 5 minutes</small></span><input type="checkbox" class="sw" id="autoSw"></label>
  </div>
</dialog>

<script>
const API = "https://api-open.data.gov.sg/v2/real-time/api/";
const REGIONS = [ // NEA region label locations, from the PSI feed
  {id:"north",name:"North",lat:1.41803,lon:103.82},{id:"south",name:"South",lat:1.29587,lon:103.82},
  {id:"east",name:"East",lat:1.35735,lon:103.94},{id:"west",name:"West",lat:1.35735,lon:103.7},
  {id:"central",name:"Central",lat:1.35735,lon:103.82}
];
const CARDS = [
  {id:"forecast2h", label:"2-hour forecast", hint:"Your area", feeds:["two-hr-forecast"]},
  {id:"air", label:"Air quality", hint:"PSI and PM2.5, your region", feeds:["psi","pm25"]},
  {id:"temp", label:"Temperature", hint:"Nearest weather station", feeds:["air-temperature"]},
  {id:"humidity", label:"Humidity", hint:"Nearest weather station", feeds:["relative-humidity"]},
  {id:"wind", label:"Wind speed", hint:"Nearest weather station", feeds:["wind-speed"]},
  {id:"rain", label:"Rainfall now", hint:"Nearest rain gauge", feeds:["rainfall"]},
  {id:"uv", label:"UV index", hint:"7am to 7pm", feeds:["uv"]},
  {id:"today", label:"Today's forecast", hint:"Your region", feeds:["twenty-four-hr-forecast"]},
  {id:"outlook", label:"4-day outlook", hint:"Singapore-wide", feeds:["four-day-outlook"]}
];
const FEED_ORDER = ["two-hr-forecast","psi","pm25","air-temperature","relative-humidity","wind-speed","rainfall","uv","twenty-four-hr-forecast","four-day-outlook"];
const FEED_NAME = {"two-hr-forecast":"2-hour forecast","psi":"PSI","pm25":"PM2.5","air-temperature":"temperature","relative-humidity":"humidity","wind-speed":"wind","rainfall":"rainfall","uv":"UV index","twenty-four-hr-forecast":"today's forecast","four-day-outlook":"4-day outlook"};
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r=>setTimeout(r,ms));

let areas = [], data = {}, failedFeeds = new Set(), fetchedAt = 0, busy = false, pickRegion = null;
let prefs = {area:"City", cards:Object.fromEntries(CARDS.map(c=>[c.id,true])), auto:true, tips:true};
try{ const p = JSON.parse(localStorage.getItem("skysg:v2")); if(p) prefs = {...prefs, ...p, cards:{...prefs.cards, ...(p.cards||{})}}; }catch(e){}
if(prefs.cards.psi !== undefined && prefs.cards.air === undefined) prefs.cards.air = prefs.cards.psi; // from earlier version
const savePrefs = () => { try{ localStorage.setItem("skysg:v2", JSON.stringify(prefs)); }catch(e){} };

function dist(aLat,aLon,bLat,bLon){ const x=(bLon-aLon)*111.32*Math.cos(aLat*Math.PI/180), y=(bLat-aLat)*110.57; return Math.hypot(x,y); }
const nearest = (list, lat, lon) => list.reduce((b,a)=> dist(lat,lon,a.lat,a.lon) < dist(lat,lon,b.lat,b.lon) ? a : b);
const hhmm = iso => new Date(iso).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:"Asia/Singapore"});
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function showMsg(t){ const m=$("msg"); m.hidden = !t; m.textContent = t || ""; }

// ---------- data ----------
async function get(path, tries=3){
  let lastErr;
  for(let i=0;i<tries;i++){
    try{
      const r = await fetch(API + path);
      if(r.status === 429){ lastErr = new Error("busy"); await sleep(10500); continue; }
      if(!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      if(j.code !== 0 || !j.data) throw new Error(j.errorMsg || "no data");
      return j.data;
    }catch(e){ lastErr = e; if(i < tries-1) await sleep(2000); }
  }
  throw lastErr;
}
function neededFeeds(){
  const f = new Set(["two-hr-forecast"]); // always: area list, background colour, rain tips
  CARDS.forEach(c=>{ if(prefs.cards[c.id]) c.feeds.forEach(x=>f.add(x)); });
  if(prefs.tips && prefs.cards.forecast2h) f.add("twenty-four-hr-forecast"); // "showers later today" tip
  return FEED_ORDER.filter(x=>f.has(x));
}
async function fetchFeeds(list){
  for(const f of list){
    try{ data[f] = await get(f); failedFeeds.delete(f); }catch(e){ failedFeeds.add(f); }
    await sleep(350);
  }
}
async function update(only){
  if(busy) return;
  busy = true; $("refresh").setAttribute("aria-busy","true"); $("ago").textContent = "Updating…"; showMsg("");
  const list = only || neededFeeds();
  await fetchFeeds(list);
  // one more attempt for anything that failed, after the rate-limit window resets
  const again = list.filter(f=>failedFeeds.has(f));
  if(again.length){ $("ago").textContent = "Retrying…"; await sleep(10500); await fetchFeeds(again); }
  busy = false; $("refresh").setAttribute("aria-busy","false");
  if(list.some(f=>!failedFeeds.has(f))) fetchedAt = Date.now();
  buildAreas();
  if(!areas.length){ showMsg("Could not reach NEA. Check your connection and tap Update now."); tickAgo(); return; }
  render();
  const still = list.filter(f=>failedFeeds.has(f)).map(f=>FEED_NAME[f]);
  if(still.length) showMsg(`Could not load ${still.join(", ")}. Tap Retry.`);
}
function buildAreas(){
  const two = data["two-hr-forecast"];
  if(!two || areas.length) return;
  areas = (two.area_metadata || two.areaMetadata || []).map(a=>{
    const loc = a.label_location || a.labelLocation;
    const o = {name:a.name, lat:loc.latitude, lon:loc.longitude};
    o.region = nearest(REGIONS, o.lat, o.lon).id;
    return o;
  }).sort((a,b)=>a.name.localeCompare(b.name));
  if(!areas.some(a=>a.name===prefs.area)) prefs.area = "City";
}
const curArea = () => areas.find(a=>a.name===prefs.area);

function nearestReading(d, lat, lon){
  if(!d || !d.stations || !d.readings || !d.readings[0]) return null;
  const vals = new Map(d.readings[0].data.map(x=>[x.stationId, x.value]));
  let best=null, bd=Infinity;
  for(const s of d.stations){
    if(!vals.has(s.id) || vals.get(s.id)==null) continue;
    const k = dist(lat, lon, s.location.latitude, s.location.longitude);
    if(k < bd){ bd=k; best={name:s.name, value:vals.get(s.id), km:k}; }
  }
  if(best){ best.unit = d.readingUnit || ""; best.time = d.readings[0].timestamp; }
  return best;
}
function skyFor(text){
  const t=(text||"").toLowerCase();
  if(t.includes("thunder")) return "storm";
  if(t.includes("rain")||t.includes("shower")||t.includes("drizzle")) return "rain";
  if(t.includes("haz")||t.includes("mist")||t.includes("fog")) return "haze";
  if(t.includes("night")) return "night";
  if(t.includes("cloud")||t.includes("overcast")||t.includes("windy")) return "cloud";
  return "clear";
}
const isWet = t => /rain|shower|drizzle|thunder/i.test(t||"");

// ---------- bands and advice (NEA / MOH / WHO guidance) ----------
function psiBand(v){
  if(v<=50) return ["Good","b-good"];
  if(v<=100) return ["Moderate","b-mod"];
  if(v<=200) return ["Unhealthy","b-unh"];
  if(v<=300) return ["Very unhealthy","b-vunh"];
  return ["Hazardous","b-haz"];
}
function psiAdvice(v){ // 24-hr PSI: for planning ahead
  if(v<=100) return "Planning ahead: normal outdoor plans are fine.";
  if(v<=200) return "Planning ahead: reduce long or strenuous outdoor activity.";
  if(v<=300) return "Planning ahead: avoid long or strenuous outdoor activity.";
  return "Planning ahead: minimise outdoor activity. Wear a fitted N95 if outdoors for hours.";
}
function pmBand(v){
  if(v<=55) return ["Normal","b-good"];
  if(v<=150) return ["Elevated","b-unh"];
  if(v<=250) return ["High","b-vunh"];
  return ["Very high","b-haz"];
}
function pmAdvice(v){ // 1-hr PM2.5: for the next hour
  if(v<=55) return "Next hour: normal activities are fine.";
  if(v<=150) return "Next hour: reduce strenuous outdoor activity.";
  if(v<=250) return "Next hour: avoid strenuous outdoor activity.";
  return "Next hour: minimise time outdoors.";
}
function uvAdvice(v){
  const nowH = +new Date().toLocaleTimeString("en-GB",{hour:"2-digit",hour12:false,timeZone:"Asia/Singapore"});
  if(nowH >= 19 || nowH < 7) return ["", ""];
  if(v<=2) return ["Low", "Low risk right now."];
  if(v<=5) return ["Moderate", "🧴 SPF 30+ sunscreen, reapply every 2 hours."];
  if(v<=7) return ["High", "🧴 SPF 30+ sunscreen, reapply every 2 hours."];
  if(v<=10) return ["Very high", "🧴 SPF 30+, hat and shade, especially 11am to 3pm."];
  return ["Extreme", "🧴 SPF 30+, cover up, avoid the midday sun."];
}
function weatherTips(text2h, a){
  const t = (text2h||"").toLowerCase(), tips = [];
  if(isWet(t)) tips.push("☂️ Bring an umbrella.");
  if(t.includes("thunder")) tips.push("⚡ Shelter if you hear thunder.");
  if(!isWet(t)){
    const rec = data["twenty-four-hr-forecast"] && data["twenty-four-hr-forecast"].records && data["twenty-four-hr-forecast"].records[0];
    if(rec){
      const now = Date.now(), soon = now + 12*3600*1000;
      const later = rec.periods.find(p=>{ const s=new Date(p.timePeriod.start).getTime(), e=new Date(p.timePeriod.end).getTime();
        const r = p.regions[a.region]; return e>now && s<soon && r && isWet(r.text); });
      if(later) tips.push(`☂️ ${later.regions[a.region].text} from ${hhmm(later.timePeriod.start)}. Pack an umbrella.`);
    }
  }
  return tips;
}

// ---------- render ----------
const retryBtn = feeds => `<button type="button" class="retry" data-retry="${feeds.join(",")}">Retry</button>`;
function render(){
  const a = curArea(); if(!a) return;
  const reg = REGIONS.find(r=>r.id===a.region);
  $("locName").textContent = a.name;
  $("locRegion").textContent = reg.name + " region";

  const two = data["two-hr-forecast"], item = two && two.items && two.items[0];
  const fc = item && item.forecasts.find(f=>f.area===a.name);
  const text = fc ? (typeof fc.forecast==="string" ? fc.forecast : fc.forecast.text) : "";
  document.body.dataset.sky = skyFor(text);
  requestAnimationFrame(()=>{ document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.body).getPropertyValue("--sky").trim(); });

  const on = id => prefs.cards[id];
  const failed = feeds => feeds.every(f=>failedFeeds.has(f) && !data[f]);
  let html = "";

  if(on("forecast2h")){
    html += `<section class="hero"><p class="when">${item ? "Next 2 hours, " + esc(item.valid_period.text) : "Next 2 hours"}</p><p class="cond">${esc(text || "Unavailable")}</p>`;
    if(!text && failed(["two-hr-forecast"])) html += retryBtn(["two-hr-forecast"]);
    if(prefs.tips){ const tips = weatherTips(text, a); if(tips.length) html += `<p class="tip">${tips.map(esc).join("<br>")}</p>`; }
    html += `</section>`;
  }

  const tiles = [];
  const tile = (label, val, src, opts={}) => tiles.push(`<div class="tile${opts.wide?" wide":""}"><span class="lbl">${label}</span>${opts.body || `<span class="val">${val}</span>`}<span class="src">${src}</span>${opts.tip && prefs.tips ? `<div class="tip">${opts.tip}</div>` : ""}${opts.retry ? retryBtn(opts.retry) : ""}</div>`);
  const stationSrc = r => r ? `${esc(r.name.replace("Meteorological Station","Met Station"))}, ${r.km.toFixed(1)} km, ${hhmm(r.time)}` : "No reading";

  if(on("air")){
    const it = data.psi && data.psi.items && data.psi.items[0];
    const v = it && it.readings.psi_twenty_four_hourly && it.readings.psi_twenty_four_hourly[a.region];
    const pit = data.pm25 && data.pm25.items && data.pm25.items[0];
    const pm = pit && pit.readings && pit.readings.pm25_one_hourly && pit.readings.pm25_one_hourly[a.region];
    let body = `<div class="aq">`;
    if(v != null){ const [b,c] = psiBand(v); body += `<div><span class="lbl">24-hour PSI</span><div class="val">${v}</div><span class="band ${c}">${b}</span></div>`; }
    else body += `<div><span class="lbl">24-hour PSI</span><div class="val">--</div></div>`;
    if(pm != null){ const [b,c] = pmBand(pm); body += `<div><span class="lbl">1-hour PM2.5</span><div class="val">${pm}<small> µg/m³</small></div><span class="band ${c}">${b}</span></div>`; }
    else body += `<div><span class="lbl">1-hour PM2.5</span><div class="val">--</div></div>`;
    body += `</div>`;
    const times = [it && `PSI ${hhmm(it.timestamp)}`, pit && `PM2.5 ${hhmm(pit.timestamp)}`].filter(Boolean).join(", ");
    const tl = [];
    if(pm != null) tl.push("😷 " + pmAdvice(pm));
    if(v != null) tl.push("📅 " + psiAdvice(v));
    let tip = tl.map(esc).join("<br>");
    if((v != null && v > 100) || (pm != null && pm > 55)) tip += `<br><a href="https://www.haze.gov.sg" target="_blank" rel="noopener">Advice for higher-risk groups ↗</a>`;
    const miss = ["psi","pm25"].filter(f=>failedFeeds.has(f) && !data[f]);
    tile(`Air quality, ${reg.name} region`, "", times || "No reading", {wide:true, body, tip, retry: miss.length ? miss : null});
  }
  if(on("temp")){ const r = nearestReading(data["air-temperature"], a.lat, a.lon); tile("Temperature", r ? `${r.value.toFixed(1)}<small>°C</small>` : "--", stationSrc(r), {retry: !r && failed(["air-temperature"]) ? ["air-temperature"] : null}); }
  if(on("humidity")){ const r = nearestReading(data["relative-humidity"], a.lat, a.lon); tile("Humidity", r ? `${Math.round(r.value)}<small>%</small>` : "--", stationSrc(r), {retry: !r && failed(["relative-humidity"]) ? ["relative-humidity"] : null}); }
  if(on("wind")){ const r = nearestReading(data["wind-speed"], a.lat, a.lon); tile("Wind speed", r ? `${Math.round(/knot/i.test(r.unit) ? r.value*1.852 : r.value)}<small> km/h</small>` : "--", stationSrc(r), {retry: !r && failed(["wind-speed"]) ? ["wind-speed"] : null}); }
  if(on("rain")){
    const r = nearestReading(data["rainfall"], a.lat, a.lon);
    tile("Rainfall, last 5 min", r ? (r.value>0 ? `${r.value}<small> mm</small>` : "None") : "--", stationSrc(r), {retry: !r && failed(["rainfall"]) ? ["rainfall"] : null});
  }
  if(on("uv")){
    const rec = data.uv && data.uv.records && data.uv.records[0], u = rec && rec.index && rec.index[0];
    if(u){ const [cat, tip] = uvAdvice(u.value);
      tile("UV index", `${u.value}${cat ? `<small> ${cat}</small>` : ""}`, `Changi, ${hhmm(u.hour)}`, {tip: esc(tip)});
    } else tile("UV index", "--", "7am to 7pm only", {retry: failed(["uv"]) ? ["uv"] : null});
  }
  if(tiles.length) html += `<div class="tiles">${tiles.join("")}</div>`;

  if(on("today")){
    const rec = data["twenty-four-hr-forecast"] && data["twenty-four-hr-forecast"].records && data["twenty-four-hr-forecast"].records[0];
    if(rec){
      const g = rec.general, now = Date.now();
      const rows = rec.periods.filter(p=>new Date(p.timePeriod.end).getTime()>now).map(p=>{
        const r = p.regions[a.region] || Object.values(p.regions)[0];
        return `<li><div class="row"><span class="k">${hhmm(p.timePeriod.start)} to ${hhmm(p.timePeriod.end)}</span><span class="v">${esc(r.text)}</span></div></li>`;
      }).join("");
      html += `<section class="block"><h2>Today, ${reg.name} region</h2><p class="sub">${g.temperature.low} to ${g.temperature.high}°C</p><ul class="list">${rows}</ul></section>`;
    } else if(failed(["twenty-four-hr-forecast"])) html += `<section class="block"><h2>Today</h2><p class="sub">Could not load.</p>${retryBtn(["twenty-four-hr-forecast"])}</section>`;
  }
  if(on("outlook")){
    const frec = data["four-day-outlook"] && data["four-day-outlook"].records && data["four-day-outlook"].records[0];
    if(frec){
      const rows = frec.forecasts.map(f=>`<li><div class="row"><span class="k">${new Date(f.timestamp).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",timeZone:"Asia/Singapore"})}</span><span class="mm">${f.temperature.high}° <span>${f.temperature.low}°</span></span></div><div class="note">${esc((f.forecast.summary||f.forecast.text).trim())}</div></li>`).join("");
      html += `<section class="block"><h2>Next 4 days</h2><p class="sub">Singapore-wide</p><ul class="list">${rows}</ul></section>`;
    } else if(failed(["four-day-outlook"])) html += `<section class="block"><h2>Next 4 days</h2><p class="sub">Could not load.</p>${retryBtn(["four-day-outlook"])}</section>`;
  }
  if(html) html += `<section class="block"><h2>Official advisories</h2><div class="links">
    <a href="https://www.weather.gov.sg" target="_blank" rel="noopener">Weather warnings (MSS) ↗</a>
    <a href="https://www.haze.gov.sg" target="_blank" rel="noopener">Haze (NEA) ↗</a>
    <a href="https://info.pub.gov.sg/drainage/floodmanagement/subscribesms" target="_blank" rel="noopener">Flood alerts (PUB) ↗</a></div></section>`;
  if(!html) html = `<div class="empty">Nothing is switched on.<br><button type="button" id="emptyBtn">Choose what to show</button></div>`;
  $("content").innerHTML = html;
  const eb = $("emptyBtn"); if(eb) eb.onclick = openSettings;
  tickAgo();
}
function tickAgo(){
  if(busy) return;
  if(!fetchedAt){ $("ago").textContent = "Not updated yet"; return; }
  const m = Math.floor((Date.now()-fetchedAt)/60000);
  $("ago").textContent = m < 1 ? "Updated just now" : `Updated ${m} min ago`;
}
$("content").addEventListener("click", e=>{
  const b = e.target.closest("[data-retry]");
  if(b){ b.textContent = "Retrying…"; b.disabled = true; update(b.dataset.retry.split(",")); }
});

// ---------- location sheet ----------
function drawAreas(){
  $("regionChips").innerHTML = REGIONS.map(r=>`<button type="button" class="chip" data-r="${r.id}" aria-pressed="${r.id===pickRegion}">${r.name}</button>`).join("");
  $("areaList").innerHTML = areas.filter(a=>a.region===pickRegion).map(a=>`<li><button type="button" data-a="${esc(a.name)}" aria-current="${a.name===prefs.area}">${esc(a.name)}</button></li>`).join("");
}
function chooseArea(name){ prefs.area = name; savePrefs(); $("locSheet").close(); render(); }
$("locOpen").onclick = () => { if(!areas.length) return; pickRegion = curArea().region; drawAreas(); $("locSheet").showModal(); };
$("regionChips").onclick = e => { const b = e.target.closest("[data-r]"); if(b){ pickRegion = b.dataset.r; drawAreas(); } };
$("areaList").onclick = e => { const b = e.target.closest("[data-a]"); if(b) chooseArea(b.dataset.a); };
$("gps").onclick = () => {
  if(!navigator.geolocation){ $("locSheet").close(); showMsg("This browser cannot share your location. Choose your area from the list."); return; }
  $("gps").textContent = "Finding you…";
  navigator.geolocation.getCurrentPosition(
    p => { $("gps").textContent = "📍 Use my current location"; chooseArea(nearest(areas, p.coords.latitude, p.coords.longitude).name); },
    () => { $("gps").textContent = "📍 Use my current location"; $("locSheet").close(); showMsg("Location access was blocked. Allow it in your browser settings, or pick your area from the list."); },
    {timeout:10000, maximumAge:600000}
  );
};

// ---------- settings sheet ----------
function openSettings(){
  $("toggles").innerHTML = `<div class="group">Show on screen</div>` + CARDS.map(c=>`<label class="tog"><span>${c.label}<small>${c.hint}</small></span><input type="checkbox" class="sw" data-c="${c.id}" ${prefs.cards[c.id]?"checked":""}></label>`).join("");
  $("autoSw").checked = prefs.auto;
  $("tipsSw").checked = prefs.tips;
  $("setSheet").showModal();
}
$("setOpen").onclick = openSettings;
$("toggles").onchange = e => { const c = e.target.dataset.c; if(c){ prefs.cards[c] = e.target.checked; savePrefs(); } };
$("autoSw").onchange = e => { prefs.auto = e.target.checked; savePrefs(); };
$("tipsSw").onchange = e => { prefs.tips = e.target.checked; savePrefs(); };
$("setSheet").addEventListener("close", () => {
  const missing = neededFeeds().filter(f=>!data[f]);
  if(missing.length) update(missing); else render();
});

// ---------- shared ----------
document.querySelectorAll("[data-close]").forEach(b=> b.onclick = () => b.closest("dialog").close());
document.querySelectorAll("dialog").forEach(d=> d.addEventListener("click", e=>{ if(e.target===d) d.close(); }));
$("refresh").onclick = e => { e.currentTarget.blur(); update(); };
setInterval(()=>{
  tickAgo();
  if(prefs.auto && !document.hidden && Date.now()-fetchedAt > 5*60*1000) update();
}, 30000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && Date.now()-fetchedAt > 5*60*1000) update(); });

update(); // load weather first

// ---------- install as an app ----------
try{ (function(){
  const standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  let dismissed = false; try{ dismissed = localStorage.getItem("skysg:instx") === "1"; }catch(e){}
  if(standalone || dismissed) return;
  const box = $("install"), go = $("instGo");
  const hide = () => { box.hidden = true; try{ localStorage.setItem("skysg:instx","1"); }catch(e){} };
  $("instX").onclick = hide;
  let deferred = null;
  window.addEventListener("beforeinstallprompt", e => { // Android Chrome, Edge
    e.preventDefault(); deferred = e;
    $("instText").textContent = "Install Sky SG as an app.";
    go.hidden = false; box.hidden = false;
  });
  go.onclick = async () => { if(!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; box.hidden = true; };
  window.addEventListener("appinstalled", () => { box.hidden = true; });
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)){ // iPhone: no install button, show how
    $("instText").textContent = "Install: tap Share, then Add to Home Screen.";
    box.hidden = false;
  }
})(); }catch(e){}
if("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
